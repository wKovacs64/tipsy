[build]
command = "npm run build"
publish = "dist"
# Skip every git-triggered build; deploy only from the CI release job's build
# hook, which Netlify never lets `ignore` cancel.
# https://docs.netlify.com/configure-builds/ignore-builds/
ignore = "exit 0"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src data: https:; script-src 'self' 'unsafe-inline'; style-src 'self'; worker-src 'self'; object-src 'none'"
Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"

# Pages from before the single-screen redesign.
[[redirects]]
from = "/calc/*"
to = "/"
status = 301

[[redirects]]
from = "/settings"
to = "/"
status = 301
