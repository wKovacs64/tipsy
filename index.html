<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tipsy</title>
    <meta name="application-name" content="Tipsy" />
    <meta name="apple-mobile-web-app-title" content="Tipsy" />
    <meta
      name="description"
      content="A simple tip calculator and bill divider"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tipsy" />
    <meta
      property="og:description"
      content="A simple tip calculator and bill divider"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tipsy" />
    <meta
      name="twitter:description"
      content="A simple tip calculator and bill divider"
    />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The app renders from script, so without these the two fonts on the
         calculator screen would only start loading after the first paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/bagel-fat-one/files/bagel-fat-one-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/figtree/files/figtree-latin-700-normal.woff2"
    />
    <meta
      name="theme-color"
      content="#f1d496"
      media="(prefers-color-scheme: light)"
      data-theme="light"
    />
    <meta
      name="theme-color"
      content="#24122c"
      media="(prefers-color-scheme: dark)"
      data-theme="dark"
    />
    <script>
      // Applies a stored theme before first paint. Mirrors applyTheme in
      // src/theme.ts, which this script cannot import.
      {
        const theme = window.localStorage.getItem("theme");
        if (theme) {
          document.documentElement.dataset.theme = theme;
          for (const meta of document.querySelectorAll(
            'meta[name="theme-color"]',
          )) {
            meta.media = meta.dataset.theme === theme ? "all" : "not all";
          }
        }
      }
    </script>
  </head>
  <body class="bg-background font-body font-medium text-foreground">
    <noscript>
      <p class="p-4">This application requires JavaScript.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
